[package]
name = "s3a-events"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Events Pack for S3A"

[dependencies]
s3a-core = { path = "../s3a-core" }
s3a-engine = { path = "../s3a-engine" }
s3a-vault = { path = "../s3a-vault" }
bytemuck = { workspace = true }
crc32c = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand_core = { version = "0.6", features = ["std"] }
ed25519-dalek = { version = "2.1" }

[dev-dependencies]
tempfile = "3"
rand = "0.8"
s3a-pack-clean = { path = "../s3a-pack-clean" }
s3a-ledger = { path = "../s3a-ledger" }
s3a-pack-scholar = { path = "../s3a-pack-scholar" }
s3a-pack-gis = { path = "../s3a-pack-gis" }
s3a-pack-ontology = { path = "../s3a-pack-ontology" }
s3a-pack-wearable = { path = "../s3a-pack-wearable" }
s3a-pack-robotics = { path = "../s3a-pack-robotics" }
s3a-pack-da = { path = "../s3a-pack-da" }
s3a-trace = { path = "../s3a-trace" }
s3a-swarm = { path = "../s3a-swarm" }
