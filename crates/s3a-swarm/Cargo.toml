[package]
name = "s3a-swarm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
s3a-core = { path = "../s3a-core" }
s3a-engine = { path = "../s3a-engine" }
s3a-vault = { path = "../s3a-vault" }
s3a-vcs = { path = "../s3a-vcs" }
s3a-harness = { path = "../s3a-harness" }
s3a-pack-scholar = { path = "../s3a-pack-scholar" }

tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
crc32c = { workspace = true }
bytemuck = { workspace = true }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["std"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[[bin]]
name = "s3a-swarm"
path = "src/main.rs"

[lib]
name = "s3a_swarm"
path = "src/lib.rs"
