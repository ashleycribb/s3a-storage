[package]
name = "s3a-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
s3a-core = { path = "../s3a-core" }
s3a-engine = { path = "../s3a-engine" }
s3a-edge = { path = "../s3a-edge" }
s3a-pack-scholar = { path = "../s3a-pack-scholar" }
s3a-pack-wearable = { path = "../s3a-pack-wearable" }
s3a-pack-robotics = { path = "../s3a-pack-robotics" }
s3a-pack-gis = { path = "../s3a-pack-gis" }
s3a-pack-da = { path = "../s3a-pack-da" }
s3a-pack-ontology = { path = "../s3a-pack-ontology" }
s3a-vault = { path = "../s3a-vault" }
s3a-vcs = { path = "../s3a-vcs" }
bytemuck = { workspace = true }
crc32c = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
humantime = { workspace = true }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["std"] }
ureq = { workspace = true }

[lib]
name = "s3a_cli"
path = "src/lib.rs"

[[bin]]
name = "s3a-cli"
path = "src/main.rs"

[dev-dependencies]
tiny_http = "0.12"
