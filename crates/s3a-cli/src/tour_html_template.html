<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>S3A tour · {{TITLE}}</title>
<style>
:root{--bg:#05080f;--panel:#0b1220;--line:#1c2a44;--txt:#cfe3ff;--dim:#6f86a8;--acc:#38e8ff;--ok:#3dffa8;--bad:#ff4d6d;--warn:#ffc04d}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 700px at 70% -10%,#0d2140 0%,var(--bg) 60%);color:var(--txt);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(56,232,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(56,232,255,.04) 1px,transparent 1px);background-size:32px 32px}
header{display:flex;gap:24px;align-items:center;padding:18px 28px;border-bottom:1px solid var(--line);background:rgba(5,8,15,.7);backdrop-filter:blur(4px);position:sticky;top:0;z-index:5}
h1{font-size:15px;letter-spacing:.25em;text-transform:uppercase;margin:0;color:var(--acc);text-shadow:0 0 12px rgba(56,232,255,.6)}
.file{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
#q{margin-left:auto;width:340px;background:#07101d;border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:4px;font:inherit;outline:none}
#q:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(56,232,255,.15)}
main{padding:22px 28px 60px}
.status{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.badge{border:1px solid var(--line);padding:5px 10px;border-radius:3px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--panel)}
.badge.ok{border-color:rgba(61,255,168,.5);color:var(--ok)}.badge.bad{border-color:rgba(255,77,109,.6);color:var(--bad)}.badge.dim{color:var(--dim)}
.label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px}
.slots{display:flex;gap:8px}
.slot{flex:1;border:1px solid var(--line);background:var(--panel);padding:8px 12px;border-radius:3px;font-size:12px}
.slot.active{border-color:var(--acc);box-shadow:inset 0 0 18px rgba(56,232,255,.12)}
.lake{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.group{border:1px solid var(--line);border-radius:4px;padding:10px;background:rgba(11,18,32,.6)}
.group h3{margin:0 0 8px;font-size:12px;font-weight:normal;letter-spacing:.12em;display:flex;gap:10px;align-items:center}
.group h3 i{width:10px;height:10px;border-radius:2px;display:inline-block}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{position:relative;min-width:120px;height:74px;border-radius:3px;cursor:pointer;padding:8px;border:1px solid;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(0,0,0,.25));transition:transform .15s,box-shadow .15s,opacity .2s;overflow:hidden}
.tile:hover{transform:translateY(-2px)}
.tile .n{font-size:11px;color:var(--dim)}.tile .t{font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile .r{font-size:11px;position:absolute;bottom:6px;left:8px;color:var(--dim)}
.tile .fill{position:absolute;left:0;bottom:0;height:3px}
.tile.dimmed{opacity:.18}.tile.hit{box-shadow:0 0 0 2px var(--acc),0 0 22px rgba(56,232,255,.5)}
.footer{border:1px dashed var(--line);padding:8px 12px;border-radius:3px;color:var(--dim);font-size:12px}
#zoom{position:fixed;inset:0;z-index:20;display:none;background:rgba(3,6,12,.72)}
#card{position:absolute;background:var(--panel);border:1px solid var(--acc);border-radius:6px;box-shadow:0 0 60px rgba(56,232,255,.25);overflow:auto;transition:all .45s cubic-bezier(.2,.8,.2,1);padding:22px 26px}
#card h2{margin:0 0 4px;font-size:18px;color:var(--acc);letter-spacing:.06em}
#card .meta{color:var(--dim);font-size:12px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:16px}
#close{position:absolute;top:14px;right:18px;background:none;border:1px solid var(--line);color:var(--txt);padding:4px 10px;cursor:pointer;font:inherit;border-radius:3px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;max-width:520px;word-break:break-all}
th{color:var(--acc);font-weight:normal;letter-spacing:.08em;position:sticky;top:-22px;background:var(--panel)}
tr.match td{background:rgba(56,232,255,.08)}
.empty{color:var(--dim);padding:10px 0}
pre{white-space:pre-wrap;color:var(--dim);font-size:12px;border-left:2px solid var(--line);padding-left:12px}
</style>
</head>
<body>
<header><h1>S3A · Hyper-Tile Map</h1><span class="file" id="file"></span>
<input id="q" placeholder="search: type, key (number), text…  ⏎ to zoom" autocomplete="off" spellcheck="false"></header>
<main>
<div class="status" id="status"></div>
<div class="label">File header · dual slots</div><div class="slots" id="slots"></div>
<div class="label">Tile lake · grouped by tile type · width ∝ bytes</div><div class="lake" id="lake"></div>
<div class="label">Seal footer</div><div class="footer" id="footer"></div>
</main>
<div id="zoom"><div id="card"></div></div>
<script type="application/json" id="s3a-data">{{DATA}}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("s3a-data").textContent);
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = String(text); return e; }
function hue(id) { return (Number(id) * 137.508) % 360; }
function color(id, a) { return "hsla(" + hue(id) + ",90%,62%," + a + ")"; }
function keyRange(f) { return f.min_key > f.max_key ? "none" : f.min_key + ".." + f.max_key; }
function fmtBytes(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + " MiB" : n >= 1024 ? (n / 1024).toFixed(0) + " KiB" : n + " B"; }

$("file").textContent = D.file + " · " + fmtBytes(D.file_bytes);
const L = D.lobby, seal = L.seal_status || {};
const floors = D.floors || [];
const status = $("status");
function badge(text, kind) { status.appendChild(el("span", "badge " + kind, text)); }
badge(seal.is_sealed ? (seal.hash_chain_verified ? "sealed · chain verified" : "sealed · chain FAILED") : "unsealed", seal.is_sealed ? (seal.hash_chain_verified ? "ok" : "bad") : "dim");
const rr = D.record_roots.status;
badge("record roots · " + rr + (rr === "ok" ? " (" + D.record_roots.checked + ")" : ""), rr === "ok" ? "ok" : rr === "mismatch" ? "bad" : "dim");
badge(L.manifest ? "manifest · present" : "manifest · absent", L.manifest ? "ok" : "dim");
badge("anchors · " + (seal.anchor_status || "none"), "dim");
badge(floors.length + " tiles · footer " + L.footer_version, "dim");
if (L.consent_summary) badge("consent · " + L.consent_summary.status, "dim");

for (const s of D.header.slots) {
  const d = el("div", "slot" + (D.header.active_slot === s.slot ? " active" : ""));
  d.appendChild(el("div", null, "Slot " + "AB"[s.slot] + (D.header.active_slot === s.slot ? " · ACTIVE" : "")));
  d.appendChild(el("div", null, s.valid ? "gen " + s.generation + " · " + s.tile_count + " tiles · CRC ok" : "empty / invalid"));
  $("slots").appendChild(d);
}

const groups = new Map();
floors.forEach((f, i) => { const k = f.type_id; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(i); });
const tileEls = [];
const maxBytes = Math.max(1, ...floors.map((f) => f.size_bytes));
for (const [tid, idxs] of groups) {
  const g = el("div", "group");
  const h = el("h3"); const sw = el("i"); sw.style.background = color(tid, 1); h.appendChild(sw);
  h.appendChild(el("span", null, floors[idxs[0]].type_name + "  ·  type " + tid + "  ·  " + idxs.length + " tile" + (idxs.length > 1 ? "s" : "")));
  g.appendChild(h);
  const box = el("div", "tiles");
  for (const i of idxs) {
    const f = floors[i];
    const t = el("div", "tile");
    t.style.borderColor = color(tid, .55); t.style.flexGrow = String(f.size_bytes / maxBytes);
    t.style.flexBasis = Math.max(120, 220 * f.size_bytes / maxBytes) + "px";
    t.appendChild(el("div", "n", "floor " + f.index + " · " + fmtBytes(f.size_bytes)));
    t.appendChild(el("div", "t", f.type_name));
    t.appendChild(el("div", "r", f.record_count + " recs · keys " + keyRange(f)));
    const fill = el("div", "fill"); fill.style.background = color(tid, .9);
    fill.style.width = Math.min(100, 8 + 92 * Math.log10(1 + f.record_count) / 4) + "%"; t.appendChild(fill);
    t.addEventListener("click", () => zoom(i, t));
    tileEls[i] = t; box.appendChild(t);
  }
  g.appendChild(box); $("lake").appendChild(g);
}
$("footer").textContent = seal.is_sealed ? "Seal " + L.footer_version + " · " + seal.summary : "No seal footer (unsealed archive).";

// ---- search: tile type (name or id), key (number inside a tile's key range), text (in decoded records)
let matches = [], lastQ = "";
function recordText(i) { const d = D.details[i]; return d && d.records ? d.records.map((r) => JSON.stringify(r)).join("\n").toLowerCase() : ""; }
function search(q) {
  q = q.trim().toLowerCase(); lastQ = q; matches = [];
  floors.forEach((f, i) => {
    let hit = !q;
    if (q) {
      const num = /^\d+$/.test(q) ? Number(q) : null;
      hit = f.type_name.toLowerCase().includes(q) || String(f.type_id) === q.replace(/^type\s*/, "")
        || (num !== null && f.min_key <= num && num <= f.max_key) || recordText(i).includes(q);
    }
    tileEls[i].classList.toggle("dimmed", !hit); tileEls[i].classList.toggle("hit", !!q && hit);
    if (q && hit) matches.push(i);
  });
}
$("q").addEventListener("input", (e) => search(e.target.value));
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && matches.length) zoom(matches[0], tileEls[matches[0]]); if (e.key === "Escape") close(); });

// ---- zoom: card grows from the tile's rectangle to the viewport
function close() { const z = $("zoom"); if (z.style.display !== "block") return; const c = $("card"); const r = c._from; if (r) Object.assign(c.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", opacity: "0" }); setTimeout(() => { z.style.display = "none"; }, 380); }
$("zoom").addEventListener("click", (e) => { if (e.target.id === "zoom") close(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
function zoom(i, from) {
  const f = floors[i], d = D.details[i] || {};
  const c = $("card"); c.textContent = "";
  const x = el("button", null, "close ✕"); x.id = "close"; x.addEventListener("click", close); c.appendChild(x);
  const h = el("h2", null, "Floor " + f.index + " · " + f.type_name); h.style.textShadow = "0 0 14px " + color(f.type_id, .6); c.appendChild(h);
  const m = el("div", "meta");
  [["type", f.type_id + " v" + f.version], ["records", f.record_count], ["bytes", fmtBytes(f.size_bytes)], ["keys", keyRange(f)], ["payload sha256", d.payload_hash || f.payload_hash_short]]
    .forEach(([k, v]) => m.appendChild(el("span", null, k + ": " + v)));
  c.appendChild(m);
  if (f.index === 0 && L.manifest && f.type_id === 78) c.appendChild(el("pre", null, L.manifest));
  const recs = d.records || [];
  if (d.fields && d.fields.length) {
    c.appendChild(el("div", "label", "schema"));
    c.appendChild(el("div", "meta", d.fields.map((x) => x.name + ":" + x.field_type + "@" + x.byte_offset).join("   ")));
  }
  c.appendChild(el("div", "label", "decoded records" + (recs.length < f.record_count ? " (first " + recs.length + " of " + f.record_count + ")" : "")));
  if (!recs.length) c.appendChild(el("div", "empty", "No decodable records in this tile."));
  else {
    const cols = [...new Set(recs.flatMap((r) => (r && typeof r === "object" ? Object.keys(r) : ["value"])))];
    const t = el("table"), hr = el("tr");
    hr.appendChild(el("th", null, "#")); cols.forEach((k) => hr.appendChild(el("th", null, k)));
    const thead = el("thead"); thead.appendChild(hr); t.appendChild(thead);
    const tb = el("tbody");
    recs.forEach((r, n) => {
      const tr = el("tr"); tr.appendChild(el("td", null, n));
      const obj = r && typeof r === "object" ? r : { value: r };
      for (const k of cols) { const v = obj[k]; tr.appendChild(el("td", null, v === undefined ? "" : typeof v === "object" ? JSON.stringify(v) : v)); }
      if (lastQ && JSON.stringify(r).toLowerCase().includes(lastQ)) tr.className = "match";
      tb.appendChild(tr);
    });
    t.appendChild(tb); c.appendChild(t);
  }
  const r = from.getBoundingClientRect(); c._from = r;
  Object.assign(c.style, { transition: "none", left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", opacity: ".2" });
  $("zoom").style.display = "block";
  const instant = new URLSearchParams(location.hash.slice(1)).has("instant");
  requestAnimationFrame(() => requestAnimationFrame(() => {
    c.style.transition = instant ? "none" : "";
    Object.assign(c.style, { left: "6vw", top: "8vh", width: "88vw", height: "84vh", opacity: "1" });
  }));
}
// Deep links: #q=<search> pre-filters, #tile=<floor> zooms in, &instant skips the animation.
{
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has("q")) { $("q").value = h.get("q"); search(h.get("q")); }
  const n = Number(h.get("tile"));
  if (h.has("tile") && tileEls[n]) setTimeout(() => zoom(n, tileEls[n]), 50);
}
</script>
</body>
</html>
