[package]
name = "s3a-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
s3a-core = { path = "../s3a-core", features = ["serde"] }
s3a-simd = { path = "../s3a-simd" }
s3a-edge = { path = "../s3a-edge" }
bytemuck = { workspace = true }
memmap2 = { workspace = true }
crc32c = { workspace = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
hex = { workspace = true }
humantime = { workspace = true }
opentimestamps = "0.2.0"
x509-tsp = "0.1.0"
der = { version = "0.7", features = ["std", "oid", "alloc"] }
cms = "0.2"
cmpv2 = "0.2"
spki = "0.7"
x509-cert = { version = "0.2", features = ["pem", "std"] }
p256 = { version = "0.13", features = ["ecdsa"] }
# Verify-only RSA (PKCS#1 v1.5 and PSS) on every target, wasm32 included. See deny.toml on
# RUSTSEC-2023-0071: it concerns private-key operations, which this crate never performs.
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
signature = "2.2"
ed25519-dalek = { version = "2.1", default-features = false }
getrandom = "0.2"
reed-solomon-erasure = "6.0.0"
miniz_oxide = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs2 = "0.4"
ureq = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[features]
default = []
fault-injection = []

[dev-dependencies]
memmap2.workspace = true
crc32c.workspace = true
s3a-engine = { path = ".", features = ["fault-injection"] }
rand = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Test-only RSA signing in anchor.rs unit tests (native only).
ring = "0.17"

