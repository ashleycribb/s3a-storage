[package]
name = "s3a-harness"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

description = "Publishable research-agent harness and Model Context Protocol (MCP) server for S3A"
readme = "README.md"
keywords = ["mcp", "agent", "research", "xapi", "provenance"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "s3a-harness"
path = "src/main.rs"

[dependencies]
s3a-core = { path = "../s3a-core" }
s3a-engine = { path = "../s3a-engine" }
s3a-simd = { path = "../s3a-simd" }
s3a-pack-scholar = { path = "../s3a-pack-scholar" }
s3a-pack-ontology = { path = "../s3a-pack-ontology" }
memmap2 = { workspace = true }
crc32c = { workspace = true }
bytemuck = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
ureq = { workspace = true }
uuid = { version = "1.27", features = ["v7"] }
sha2 = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi", "env-filter"] }
