[package]
name = "s3a-pack-tdp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Technical Data Package (TDP) pack for S3A: PDF metadata, AP242 STEP parsing, and BOM generation"

[dependencies]
s3a-core = { path = "../s3a-core" }
s3a-engine = { path = "../s3a-engine" }
bytemuck = { workspace = true }
crc32c = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
lopdf = { version = "0.47.0", default-features = false }

[features]
default = []
pdfium = []

[dev-dependencies]
tempfile = "3"
