[package]
name = "s3a-lrs-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "s3a-lrs-server"
path = "src/main.rs"

[dependencies]
s3a-core = { path = "../s3a-core" }
s3a-engine = { path = "../s3a-engine" }
s3a-pack-scholar = { path = "../s3a-pack-scholar" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
humantime = { workspace = true }
crc32c = { workspace = true }
tiny_http = "0.12"
urlencoding = "2.1"
s3a-vault = { path = "../s3a-vault" }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["std"] }

[dev-dependencies]
ureq = { workspace = true }
