# cargo-deny configuration. Advisories are NOT ignored: known issues must be fixed or
# explicitly accepted by a human (add to [advisories].ignore with a reason).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # RUSTSEC-2024-0384: instant is unmaintained. Transitive dependency of reed-solomon-erasure 6.0.0 (latest available release) via parking_lot 0.11; no safe upstream upgrade available.
  "RUSTSEC-2024-0384",
  # RUSTSEC-2026-0387: crypto-bigint timing variability. Transitive dependency of p256 0.13 via elliptic-curve 0.13; upgrading requires breaking overhaul to p256 0.14+.
  "RUSTSEC-2026-0387",
  # RUSTSEC-2023-0071 (rsa, Marvin attack; no patched release). Approved by Ashley Cribb on 2026-11-15.
  # The advisory is a timing side channel in RSA *private-key* operations (decryption and
  # signing). s3a-engine uses rsa 0.9 only to verify RFC 3161 / X.509 signatures with
  # RsaPublicKey::verify (anchor.rs, verify_rsa_signature); no private key is ever loaded,
  # so there is no secret to leak. Needed because ring cannot build for wasm32. Remove this
  # entry if rsa ever gains a private-key use here, or when a patched rsa is released.
  "RUSTSEC-2023-0071",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0", "MPL-2.0", "BSL-1.0",
  "CDLA-Permissive-2.0", "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
