name: rust-ci
# Full-workspace Rust CI (all 21 crates). Jobs are split so each failure is visible on its own.
# Known failures at time of adding (2026-10-20, main 9715e3c) are listed in the PR description;
# they are NOT suppressed. Fixing them touches crates/ (human review required).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  fmt:
    name: "cargo fmt --check (KNOWN FAILING: unformatted code in all 21 crates)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  clippy:
    name: "clippy (KNOWN FAILING: s3a-engine approx_constant)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo clippy --workspace --all-targets

  test:
    name: "cargo test --workspace (KNOWN FAILING: edge writer_tests, engine edge_engine_interop, harness e2e_lrs_test, spec-vectors micro_*)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo test --workspace --no-fail-fast

  spec-vectors:
    name: "spec-vectors conformance (KNOWN FAILING: micro_* vectors, bytemuck alignment)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo test -p s3a-spec-vectors

  edge-no-std:
    name: "s3a-edge no_std build (thumbv7em-none-eabihf)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: thumbv7em-none-eabihf }
      - run: cargo build -p s3a-edge --no-default-features --target thumbv7em-none-eabihf

  wasm:
    name: "s3a-wasm-snapshot build (wasm32-unknown-unknown)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo build -p s3a-wasm-snapshot --target wasm32-unknown-unknown --release
