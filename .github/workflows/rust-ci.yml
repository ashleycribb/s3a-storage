name: rust-ci
# Full-workspace Rust CI (all 21 crates). Jobs are split so each failure is visible on its own.
# Known failures at time of adding (2026-10-20, main 9715e3c) are listed in the PR description;
# they are NOT suppressed. Fixing them touches crates/ (human review required).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  fmt:
    name: "cargo fmt --check (KNOWN FAILING: unformatted code in all 21 crates)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  clippy:
    name: "clippy (KNOWN FAILING: s3a-engine approx_constant)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo clippy --workspace --all-targets

  test:
    name: "cargo test --workspace"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo build -p s3a-lrs-server
      - run: cargo test --workspace --no-fail-fast

  engine-windows:
    name: "cargo test -p s3a-engine (windows)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo test -p s3a-engine --no-fail-fast

  spec-vectors:
    name: "spec-vectors conformance"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo test -p s3a-spec-vectors
      - name: language-neutral runner (conformance/vectors-1.0)
        run: |
          cargo build -p s3a-spec-vectors --bin s3a-conformance
          python3 conformance/run.py --impl target/debug/s3a-conformance conformance/vectors-1.0
          python3 conformance/run.py --impl target/debug/s3a-conformance --level writer conformance/vectors-1.1
          python3 conformance/run.py --impl target/debug/s3a-conformance --level writer conformance/vectors-1.2
          python3 conformance/run.py --impl target/debug/s3a-conformance --level writer conformance/vectors-1.3
          python3 conformance/run.py --impl target/debug/s3a-conformance --level writer conformance/vectors-1.4
          python3 conformance/run.py --impl target/debug/s3a-conformance --level writer conformance/vectors-1.5

  python-reader:
    name: "independent Python reader (conformance)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: reader level, vectors-1.0 to vectors-1.5 (stdlib only, no Rust)
        env:
          PYTHONPATH: readers/python
        run: |
          python3 conformance/run.py --impl "python3 -m s3a_reader" conformance/vectors-1.0
          python3 conformance/run.py --impl "python3 -m s3a_reader" --level reader conformance/vectors-1.1
          python3 conformance/run.py --impl "python3 -m s3a_reader" --level reader conformance/vectors-1.2
          python3 conformance/run.py --impl "python3 -m s3a_reader" --level reader conformance/vectors-1.3
          python3 conformance/run.py --impl "python3 -m s3a_reader" --level reader conformance/vectors-1.4
          python3 conformance/run.py --impl "python3 -m s3a_reader" --level reader conformance/vectors-1.5

  js-reader:
    name: "independent TypeScript reader (Node and Bun, conformance)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build, npm pack, install the tarball, run reader-level vectors under Node and Bun
        run: |
          cd readers/js && npm ci && npm pack --pack-destination /tmp && cd -
          mkdir /tmp/jsi && cd /tmp/jsi && npm init -y && npm install /tmp/s3a-reader-0.1.0.tgz && cd -
          npm install -g bun@1.4.2
          for v in 1.0 1.1 1.2 1.3 1.4 1.5; do
            python3 conformance/run.py --impl /tmp/jsi/node_modules/.bin/s3a-read-js --level reader conformance/vectors-$v
            python3 conformance/run.py --impl "bun /tmp/jsi/node_modules/s3a-reader/dist/cli.js" --level reader conformance/vectors-$v
          done

  python-packages:
    name: "pip-installable packages (s3a-reader, s3a)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build and install in a fresh venv, then run the conformance runner against the installed commands
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install build==1.6.1 maturin==1.15.0
          /tmp/venv/bin/python -m build -o dist readers/python
          /tmp/venv/bin/maturin build --release -m bindings/python/Cargo.toml -o dist
          /tmp/venv/bin/pip install dist/s3a_reader-*.whl dist/s3a-*.whl
          cd /tmp
          /tmp/venv/bin/python $GITHUB_WORKSPACE/conformance/run.py --impl /tmp/venv/bin/s3a-read --level reader $GITHUB_WORKSPACE/conformance/vectors-1.5
          /tmp/venv/bin/python $GITHUB_WORKSPACE/conformance/run.py --impl /tmp/venv/bin/s3a --level reader $GITHUB_WORKSPACE/conformance/vectors-1.5

  edge-no-std:
    name: "s3a-edge no_std build (thumbv7em-none-eabihf)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: thumbv7em-none-eabihf }
      - run: cargo build -p s3a-edge --no-default-features --target thumbv7em-none-eabihf

  wasm:
    name: "s3a-wasm-snapshot build (wasm32-unknown-unknown)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo build -p s3a-wasm-snapshot --target wasm32-unknown-unknown --release
