name: S3A Gate Worker & Navigation CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "cloudflare/**"
      - "scripts/**"
      - ".github/workflows/s3a-gate-ci.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "cloudflare/**"
      - "scripts/**"
      - ".github/workflows/s3a-gate-ci.yml"

jobs:
  verify:
    name: Typecheck, Security Tests & Nav Crawl
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Cloudflare Worker Dependencies
        run: |
          cd cloudflare
          npm install

      - name: TypeScript Compile Check
        run: |
          cd cloudflare
          npx tsc --noEmit

      - name: Run Security Hardening Tests
        run: node scripts/security-test.mjs
        env:
          BASE_URL: "https://s3a-gate.ashley-e-cribb.workers.dev"
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}

      - name: Run Navigation Crawler Test (Expect 200, Zero 404s)
        run: node scripts/crawl-nav-test.mjs
        env:
          BASE_URL: "https://s3a-gate.ashley-e-cribb.workers.dev"
