name: Release Prebuilt Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: s3a-x86_64-unknown-linux-gnu.tar.gz
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_name: s3a-aarch64-unknown-linux-gnu.tar.gz
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: s3a-aarch64-apple-darwin.tar.gz
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: s3a-x86_64-pc-windows-msvc.zip
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p s3a-cli
          else
            cargo build --release --target ${{ matrix.target }} -p s3a-cli
          fi
        shell: bash

      - name: Package release assets (Unix)
        if: runner.os != 'Windows'
        run: |
          STAGE_DIR="s3a-${{ matrix.target }}"
          mkdir -p "$STAGE_DIR"
          cp "target/${{ matrix.target }}/release/s3a" "$STAGE_DIR/"
          cp "target/${{ matrix.target }}/release/s3a-cli" "$STAGE_DIR/"
          cp README.md LICENSE-* QUICKSTART.md "$STAGE_DIR/" 2>/dev/null || true
          tar -czvf "${{ matrix.archive_name }}" -C "$STAGE_DIR" .
          shasum -a 256 "${{ matrix.archive_name }}" > "${{ matrix.archive_name }}.sha256"
        shell: bash

      - name: Package release assets (Windows)
        if: runner.os == 'Windows'
        run: |
          $stage = "s3a-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage
          Copy-Item "target\${{ matrix.target }}\release\s3a.exe" $stage\
          Copy-Item "target\${{ matrix.target }}\release\s3a-cli.exe" $stage\
          if (Test-Path README.md) { Copy-Item README.md $stage\ }
          if (Test-Path QUICKSTART.md) { Copy-Item QUICKSTART.md $stage\ }
          Compress-Archive -Path "$stage\*" -DestinationPath "${{ matrix.archive_name }}"
          (Get-FileHash -Algorithm SHA256 "${{ matrix.archive_name }}").Hash.ToLower() + "  ${{ matrix.archive_name }}" | Out-File -Encoding ascii "${{ matrix.archive_name }}.sha256"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Aggregate SHA256 checksums
        run: |
          mkdir -p dist
          find release-assets -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} dist/ \;
          find release-assets -type f -name "*.sha256" -exec cat {} + > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "S3A Storage ${{ github.ref_name }}" \
            --notes-file QUICKSTART.md
