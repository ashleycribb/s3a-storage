[workspace]
resolver = "2"
members = [
    "crates/s3a-core",
    "crates/s3a-simd",
    "crates/s3a-engine",
    "crates/s3a-cabi",
    "crates/s3a-cli",
    "crates/s3a-harness",
    "crates/s3a-pack-scholar",
    "crates/s3a-pack-wearable",
    "crates/s3a-pack-robotics",
    "crates/s3a-pack-gis",
    "crates/s3a-pack-da",
    "crates/s3a-pack-ontology",
    "crates/s3a-wasm-snapshot",
    "crates/s3a-lrs-server",
    "crates/s3a-spec-vectors",
    "crates/s3a-edge",
    "crates/s3a-vault",
    "crates/s3a-vcs",
    "crates/s3a-swarm",
    "crates/s3a-ledger",
    "crates/s3a-trace",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["S3A Architecture Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ashleycribb/s3a-storage"

[workspace.dependencies]
bytemuck = { version = "1.18", default-features = false, features = ["derive"] }
memmap2 = "0.9"
crc32c = "0.6"
criterion = { version = "0.5", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
humantime = "2.1"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
miniz_oxide = "0.9"



