[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "s3a-reader"
version = "0.1.0"
description = "Independent pure-Python (stdlib only) reader for S3A Hyper-Tile archives, written from the spec"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
dependencies = []

[project.urls]
Source = "https://github.com/ashleycribb/s3a-storage"
Specification = "https://github.com/ashleycribb/s3a-storage/blob/main/docs/spec/S3A-TILE-SPEC.md"

[project.scripts]
s3a-read = "s3a_reader.__main__:entry"

[tool.setuptools]
packages = ["s3a_reader"]
